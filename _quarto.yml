project:
  type: default
  output-dir: _site
  render:
    - "*.qmd"
    - "!materials/"
  resources:
    - materials/data/fieldwork-log.csv
    - materials/data/fieldnotes.csv
    - materials/data/codebook.csv
    - materials/data/messages.csv

format:
  revealjs:
    theme: styles/taste-guide.scss
    slide-number: c/t
    hash-type: number
    code-copy: true
    code-overflow: wrap
    highlight-style: styles/taste-guide.theme
    transition: none
    width: 1280
    height: 720
    margin: 0.06
    menu:
      side: left
    footer: "23 October 2026 - Guest seminar for Digital Ethnography"
    preview-links: auto
    link-external-newwindow: true
